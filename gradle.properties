org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## 环境 —— 与 MCphone 本体逐字相同，理由见本体 gradle.properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
neo_version_range=[21.1.200,)
loader_version_range=[1,)

## 模组
mod_id=minetendo
mod_name=Minetendo & CraftStation
# melonDS 是 GPL-3.0-or-later，这一整个 jar 与它静态链接，所以本模组跟着 GPL。
# 见 LICENSE 与 docs/BUILD-NATIVE.md 末尾的合规清单。
mod_license=GPL-3.0-or-later
mod_version=0.3.2
mod_group_id=com.november.minetendo
mod_authors=november521

## MCphone 本体
# 编译对着 libs/ 里那个 jar；这个数同时是 mods.toml 里 versionRange 的下限，
# 两者必须是同一个数。
mcphone_version=1.12.0

## 原生库
# melonDS 源码树的位置（CMake 的 MELONDS_DIR 从这里来）。
# 用 git submodule 或手动 clone 都行，build-windows.ps1 会在缺的时候自己拉。
melonds_dir=native/third_party/melonDS
