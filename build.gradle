plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "minetendo-craftstation"
}

// 1.21.1 的玩家跑 Java 21。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // 统一开发实例：别再生成 run/ 造成第二个实例
            gameDirectory = file("D:/Minetendo-Instance-20261113-1919/neoforge-1.21.1/run")
        }

        // 服务端运行配置。这个模组在服务端是有活干的：开一个只发给本服玩家的
        // ROM 库 HTTP 服务，见 docs/03-server-admin.md。所以这里必须有它 ——
        // 没有 server 配置，服主那条路径就永远只能靠"读代码相信它行"。
        server {
            server()
            gameDirectory = file("D:/Minetendo-Instance-20261113-1919/neoforge-1.21.1/server")
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ── 源码分层 ───────────────────────────────────────────────────────────
//
// src/main/java     平台无关（手机页面、下载器、HTTP 库、存档、JNI 声明）
// src/neoforge/java 1.21.1 专属（mod 入口、网络包、事件、ResourceLocation 构造、FMLPaths）
//
// 分开放而不是靠 exclude 列表：exclude 是按路径匹配的、对【所有】源码目录生效，
// 于是 1.20.1 那份工程想替换同名类时会被自己的 exclude 一起排掉。分开目录之后，
// "共享 / 平台"这条边界是目录结构说清楚的，不靠一层容易写错的规则。
sourceSets.main.java.srcDir 'src/neoforge/java'

// 平台专属资源：pack.mcmeta 的 pack_format 两个版本不同（1.20.1=15 / 1.21.1=34），
// 所以按模块放。jar 里没有 pack.mcmeta 时，Forge 会报 "Missing metadata in pack"
// 并整个资源包都不挂载 —— 语言、模型、贴图全没了，表现就是原始键名 + 紫黑格子。
sourceSets.main.resources.srcDir 'src/neoforge/resources'

configurations {
    runtimeClasspath.extendsFrom localRuntime
}


// ── 原生库 ────────────────────────────────────────────────────────────────
//
// 产物是 src/main/resources/natives/<platform>/minetendo.dll，
// 由 native/build-windows.ps1 编译后拷进来。Gradle 不负责编译 C++：
// 那需要 JDK 的 jni.h、melonDS 的 CMake 子工程和一台装了 MSVC / clang 的机器，
// 塞进 Gradle 只会让它变成一个更难查的失败点。
//
// 这里只做「检查它在不在」，缺了就在构建日志里大声说出来，而不是等到玩家
// 点开 App 时看到一行 UnsatisfiedLinkError。

var nativesDir = layout.projectDirectory.dir('src/main/resources/natives')

// 注意：fileTree 必须在【配置期】建好，不能写进 doLast。
// 在 doLast 里调用 fileTree() 会捕获 Gradle 脚本对象，配置缓存会直接拒绝执行
// （报的是 "references a Gradle script object from a Groovy closure at execution
// time"，看着像语法问题，其实是缓存兼容性问题）。
var nativeLibs = fileTree('src/main/resources/natives') { include '**/minetendo*.dll' }

tasks.register('checkNatives') {
    group = 'verification'
    description = '确认原生库已经拷进 resources/natives/'
    inputs.files(nativeLibs).optional()
    doLast {
        def found = nativeLibs.files
        if (found.isEmpty()) {
            logger.warn('''
                ┌──────────────────────────────────────────────────────────────┐
                │ 没有找到原生库：src/main/resources/natives/**/minetendo*.dll   │
                │ 这个 jar 能编出来，但玩家点开 NDS App 只会看到「原生库缺失」。│
                │ 先跑 native/build-windows.ps1（见 docs/BUILD-NATIVE.md）。    │
                └──────────────────────────────────────────────────────────────┘
                ''')
        } else {
            found.each { logger.lifecycle("原生库: ${it} (${(it.length() / 1024 / 1024).round(1)} MB)") }
        }
    }
}

tasks.named('processResources') { dependsOn 'checkNatives' }

// 资源模板：把 gradle.properties 的数填进 neoforge.mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}
